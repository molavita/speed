<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="https://raw.githubusercontent.com/molavita/speed/refs/heads/gh-pages/imagen/speed.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test de Velocidad MTM</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%);
      color: #fff;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
    }
    .title { font-size: 24px; margin-bottom: 20px; }
    .speed { font-size: 36px; font-weight: bold; margin: 10px 0; }
    .units { font-size: 18px; }
    .button {
      background-color: #00aaff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      margin: 5px;
    }
    .button:hover { background-color: #0077cc; }
    .button:disabled {
      background-color: #666;
      cursor: not-allowed;
    }
    #myChart { width: 100%; height: 250px; margin-top: 20px; }
    #ipInfo { margin-top: 15px; font-size: 16px; line-height: 1.4; }
    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      margin: 15px 0;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background-color: #00aaff;
      width: 0%;
      transition: width 0.3s;
    }
    .status {
      margin: 10px 0;
      font-size: 14px;
      color: #ddd;
    }
    .test-info {
      margin: 10px 0;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">Test de Velocidad MTM</div>

    <div>Velocidad de descarga</div>
    <div id="downloadSpeed" class="speed">0 <span class="units">Mbps</span></div>

    <div class="progress-bar">
      <div class="progress" id="progressBar"></div>
    </div>
    <div id="testInfo" class="test-info">Resultados de las pruebas aparecerán aquí.</div>

    <div id="ipInfo">Cargando información IP...</div>

    <button class="button" id="startBtn">Iniciar Test</button>

    <canvas id="myChart"></canvas>
  </div>

  <script>
    // Inicialización del Gráfico
    const ctx = document.getElementById('myChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { 
        labels: [], 
        datasets: [{
          label: 'Velocidad (Mbps)',
          borderColor: 'rgb(0, 170, 255)',
          backgroundColor: 'rgba(0, 170, 255, 0.1)',
          data: [],
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        animation: false,
        scales: {
          x: { title: { display: true, text: 'Progreso' } },
          y: { min: 0, title: { display: true, text: 'Mbps' }, suggestedMax: 50 }
        }
      }
    });

    // Información de IP
    async function getIpInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        document.getElementById('ipInfo').innerHTML = `
         🌐 <b>IP:</b> ${data.ip} <br>
          📍 <b>Ciudad:</b> ${data.city || 'Desconocida'} <br>
          🗺️ <b>Región:</b> ${data.region || 'Desconocida'} <br>
          🌎 <b>País:</b> ${data.country_name || 'Desconocido'} <br>
          🏢 <b>Proveedor:</b> ${data.org || 'No disponible'}
        `;
      } catch (error) {
        document.getElementById('ipInfo').innerHTML = "⚠️ No se pudo obtener la información IP.";
      }
    }

    // Función principal del Test
    async function measureDownload() {
      const downloadSpeedEl = document.getElementById('downloadSpeed');
      const startBtn = document.getElementById('startBtn');
      const progressBar = document.getElementById('progressBar');
      const statusEl = document.getElementById('status');
      const testInfoEl = document.getElementById('testInfo');
      
      startBtn.disabled = true;
      startBtn.textContent = "Midiendo...";
      progressBar.style.width = '0%';
      testInfoEl.innerHTML = ""; 
      
      chart.data.labels = [];
      chart.data.datasets[0].data = [];
      chart.update();
      
      const testUrl = "https://speed.cloudflare.com/__down?bytes=50000000";
      let speeds = [];
      let resultadosAcumulados = "";
      const testDuration = 8000; // 8 segundos de límite
      
      for (let i = 0; i < 3; i++) {
        statusEl.textContent = `Realizando Prueba ${i+1} de 3...`;
        
        try {
          const speed = await performAccurateDownloadTest(testUrl, testDuration, i);
          
          if (speed > 0) {
            speeds.push(speed);
            resultadosAcumulados += `Prueba ${i+1}: <b>${speed.toFixed(2)} Mbps</b><br>`;
          } else {
            resultadosAcumulados += `Prueba ${i+1}: <span style="color:#ff6b6b">Sin datos</span><br>`;
          }

          testInfoEl.innerHTML = resultadosAcumulados;
          chart.data.labels.push(`P${i+1}`);
          chart.data.datasets[0].data.push(speed.toFixed(2));
          chart.update();
          
          downloadSpeedEl.innerHTML = `${speed.toFixed(2)} <span class="units">Mbps</span>`;
          progressBar.style.width = `${((i + 1) / 3) * 100}%`;
          
          if (i < 2) await new Promise(r => setTimeout(r, 1000));
        } catch (error) {
          console.error(error);
          speeds.push(0);
        }
      }
      
      // Cálculo de la MEDIA FINAL
      const validSpeeds = speeds.filter(s => s > 0);
      const avgSpeed = validSpeeds.length > 0 ? (validSpeeds.reduce((a, b) => a + b, 0) / validSpeeds.length) : 0;
      
      downloadSpeedEl.innerHTML = `${avgSpeed.toFixed(2)} <span class="units">Mbps</span>`;
      statusEl.textContent = "Test completado";
      testInfoEl.innerHTML = resultadosAcumulados + 
        `<hr style="border:0; border-top:1px solid rgba(255,255,255,0.2); margin:10px 0;">` +
        `<span style="font-size:18px;"><b>MEDIA TOTAL: ${avgSpeed.toFixed(2)} Mbps</b></span>`;
      
      startBtn.disabled = false;
      startBtn.textContent = "Iniciar Test";
    }

    // Función de descarga técnica
    function performAccurateDownloadTest(url, duration, testId) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        let startTime;
        let lastUpdate = 0;
        let currentSpeed = 0; 

        const finalUrl = url + "&nocache=" + Date.now() + "_" + testId;
        xhr.open('GET', finalUrl, true);
        xhr.responseType = 'blob';

        xhr.onprogress = (e) => {
          if (!startTime) startTime = performance.now();
          const now = performance.now();
          const timeElapsed = (now - startTime) / 1000;

          if (timeElapsed > 0 && e.loaded > 0) {
            currentSpeed = (e.loaded * 8) / (timeElapsed * 1000000); 
            
            document.getElementById('downloadSpeed').innerHTML = 
              `${currentSpeed.toFixed(2)} <span class="units">Mbps</span>`;
            
            if (now - lastUpdate > 300) {
              chart.data.datasets[0].data.push(parseFloat(currentSpeed.toFixed(2)));
              chart.data.labels.push("");
              chart.update('none');
              lastUpdate = now;
            }
          }
        };

        // Al terminar, fallar o abortar, devolvemos currentSpeed (la última medida)
        const finalize = () => resolve(currentSpeed);

        xhr.onload = finalize;
        xhr.onerror = finalize;
        xhr.onabort = finalize;

        setTimeout(() => {
          if (xhr.readyState !== 4) xhr.abort();
        }, duration);

        xhr.send();
      });
    }

    // Eventos iniciales
    document.getElementById('startBtn').addEventListener('click', measureDownload);
    getIpInfo();
  </script>
</body>
</html>
