<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="https://raw.githubusercontent.com/molavita/speed/refs/heads/gh-pages/imagen/speed.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test de Velocidad MTM</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%);
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 90%
    }

    .title { font-size: 24px; margin-bottom: 20px; }
    .speed { font-size: 36px; font-weight: bold; margin: 10px 0; }
    .units { font-size: 18px; }
    
    .button {
      background-color: #00aaff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      margin: 5px;
    }

    .button:hover { background-color: #0077cc; }
    .button:disabled {
      background-color: #666;
      cursor: not-allowed;
    }

    #myChart { width: 100%; height: 250px; margin-top: 20px; }
    #ipInfo { margin-top: 15px; font-size: 16px; line-height: 1.4; }

    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background-color: #00aaff;
      width: 0%;
      transition: width 0.3s;
    }

    .status {
      margin: 10px 0;
      font-size: 14px;
      color: #ddd;
    }

    .test-info {
      margin: 10px 0;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">Test de Velocidad MTM</div>
    <div>Velocidad de descarga</div>
    <div id="downloadSpeed" class="speed">0 <span class="units">Mbps</span></div>
    <div class="progress-bar">
      <div class="progress" id="progressBar"></div>
    </div>
    <div class="status" id="status">Listo para iniciar</div>
    <div class="test-info" id="testInfo"></div>
    <div id="ipInfo">Cargando información IP...</div>
    <button class="button" id="startBtn">Iniciar Test</button>
    <canvas id="myChart"></canvas>
  </div>
  <script>
    const ctx = document.getElementById('myChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { 
        labels: [], 
        datasets: [{
          label: 'Velocidad de Descarga (Mbps)',
          borderColor: 'rgb(0, 170, 255)',
          backgroundColor: 'rgba(0, 170, 255, 0.1)',
          data: [],
          fill: true,
          tension: 0.3
        }]

      },

      options: {
        animation: false,
        scales: {
          x: { 
            title: { display: true, text: 'Tiempo (segundos)' }
          },
          y: { 
            min: 0, 
            title: { display: true, text: 'Mbps' },
            suggestedMax: 100
          }
        }
      }
    });

    async function getIpInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();

        document.getElementById('ipInfo').innerHTML = `
          🌐 <b>IP:</b> ${data.ip} <br>
          📍 <b>Ciudad:</b> ${data.city || 'Desconocida'} <br>
          🗺️ <b>Región:</b> ${data.region || 'Desconocida'} <br>
          🌎 <b>País:</b> ${data.country_name || 'Desconocido'} <br>
          🏢 <b>Proveedor:</b> ${data.org || 'No disponible'}
        `;

      } catch (error) {
        document.getElementById('ipInfo').innerHTML = "⚠️ No se pudo obtener la información IP.";
        console.error(error);
      }
    }

    async function measureDownload() {
      const downloadSpeedEl = document.getElementById('downloadSpeed');
      const startBtn = document.getElementById('startBtn');
      const progressBar = document.getElementById('progressBar');
      const statusEl = document.getElementById('status');
      const testInfoEl = document.getElementById('testInfo');
      startBtn.disabled = true;
      startBtn.textContent = "Midiendo...";
      progressBar.style.width = '0%';
      chart.data.labels = [];
      chart.data.datasets[0].data = [];
      chart.update();

      const testFiles = [
        "https://httpbun.com/bytes/10485760",
        "https://httpbingo.org/bytes/10485760",
        "https://httpbin.org/bytes/10485760"
      ];

      let speeds = [];
      const testDuration = 8000;
      statusEl.textContent = "Iniciando prueba de velocidad...";
      testInfoEl.textContent = "Descargando archivos grandes para medición precisa...";
      for (let i = 0; i < 3; i++) {
        const fileIndex = i % testFiles.length;
        const testFile = testFiles[fileIndex];
        statusEl.textContent = `Prueba ${i+1}/3 en progreso...`;
        progressBar.style.width = `${((i + 1) / 3) * 100}%`;

        try {
          const speed = await performAccurateDownloadTest(testFile, testDuration, i);
          // Corregir velocidad para evitar infinity
          let validatedSpeed = speed;
          if (speed === Infinity || isNaN(speed) || speed <= 0) {
            validatedSpeed = 0;
          }
          speeds.push(validatedSpeed);
          const timeLabel = `${(i + 1) * 8}s`;
          chart.data.labels.push(timeLabel);
          chart.data.datasets[0].data.push(parseFloat(validatedSpeed.toFixed(2)));
          chart.update();
          downloadSpeedEl.innerHTML = `${validatedSpeed.toFixed(2)} <span class="units">Mbps</span>`;
          testInfoEl.textContent = `Prueba ${i+1}: ${validatedSpeed.toFixed(2)} Mbps`;
        } catch (error) {
          console.error(`Error en prueba ${i+1}:`, error);
          statusEl.textContent = `Error en prueba ${i+1}, continuando...`;
          speeds.push(0);
        }

        if (i < 2) {
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      const validSpeeds = speeds.filter(speed => speed > 0);
      const avgSpeed = validSpeeds.length > 0 
        ? validSpeeds.reduce((a, b) => a + b, 0) / validSpeeds.length 
        : 0;

      downloadSpeedEl.innerHTML = `${avgSpeed.toFixed(2)} <span class="units">Mbps</span>`;
      statusEl.textContent = validSpeeds.length === 3 
        ? "Prueba completada exitosamente" 
        : `Prueba completada (${validSpeeds.length}/3 exitosas)`;
      testInfoEl.textContent = `Velocidad promedio: ${avgSpeed.toFixed(2)} Mbps`;
      startBtn.disabled = false;
      startBtn.textContent = "Iniciar Test";
    }
    
    async function performAccurateDownloadTest(url, duration, testId) {
  return new Promise((resolve, reject) => {
    let startTime = null;
    let xhr = new XMLHttpRequest();
    // Usamos un intervalo para actualizar el gráfico cada 200ms durante la descarga
    let chartUpdateInterval;

    xhr.open('GET', url + '?nocache=' + Date.now() + testId, true);

    xhr.onprogress = function(e) {
      if (!startTime) startTime = performance.now();
      
      const now = performance.now();
      const timeElapsed = (now - startTime) / 1000;

      if (timeElapsed > 0) {
        // CÁLCULO: (Bytes * 8 bits) / (Segundos * 1,000,000) = Mbps
        const speedMbps = (e.loaded * 8) / (timeElapsed * 1000000);
        
        // Actualizar el número grande en pantalla en tiempo real
        document.getElementById('downloadSpeed').innerHTML = 
          `${speedMbps.toFixed(2)} <span class="units">Mbps</span>`;

        // Actualizar el gráfico cada cierto tiempo (opcional para fluidez)
        if (!chartUpdateInterval || now - lastUpdate > 200) {
            chart.data.labels.push(""); // O un timestamp corto
            chart.data.datasets[0].data.push(speedMbps.toFixed(2));
            chart.update('none'); // 'none' para que no sea lenta la animación
            lastUpdate = now;
        }
      }
    };

    let lastUpdate = 0;

    xhr.onload = function() {
      const timeElapsed = (performance.now() - startTime) / 1000;
      const finalSpeed = (xhr.response.byteLength * 8) / (timeElapsed * 1000000);
      resolve(finalSpeed);
    };

    xhr.onerror = () => reject(new Error('Error de conexión'));
    
    // Timeout de seguridad
    setTimeout(() => {
        if(xhr.readyState !== 4) xhr.abort();
    }, duration);

    xhr.responseType = 'arraybuffer'; // Ayuda a medir el tamaño exacto en memoria
    xhr.send();
  });
}
    document.getElementById('startBtn').addEventListener('click', measureDownload);
    getIpInfo();
  </script>
</body>
</html>
