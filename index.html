<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/molavita/speed/refs/heads/gh-pages/imagen/speed.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test de Velocidad MTM</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%);
            color: #fff;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 90%;
        }

        .title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .speed {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }

        .units {
            font-size: 18px;
            font-weight: normal;
        }

        .button {
            background-color: #00aaff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px;
        }

        .button:hover {
            background-color: #0077cc;
        }

        #myChart {
            width: 100%;
            height: 250px;
            margin-top: 20px;
        }

        #ipInfo {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">Test de Velocidad MTM</div>

        <div>Velocidad de descarga</div>
        <div id="downloadSpeed" class="speed">0 <span class="units">Mbps</span></div>

        <div id="ipInfo"></div>

        <button class="button" id="startBtn">Iniciar Test</button>

        <canvas id="myChart"></canvas>
    </div>

    <script>
        // === Configurar gráfico ===
        const ctx = document.getElementById("myChart").getContext("2d");
        const chart = new Chart(ctx, {
            type: "line",
            data: {
                labels: [],
                datasets: [
                    {
                        label: "Velocidad de Descarga (Mbps)",
                        borderColor: "rgb(0, 170, 255)",
                        data: [],
                        fill: false,
                        tension: 0.2,
                    },
                ],
            },
            options: {
                animation: false,
                scales: {
                    x: {
                        title: { display: true, text: "Tiempo (segundos)" },
                    },
                    y: {
                        min: 0,
                        title: { display: true, text: "Mbps" },
                    },
                },
            },
        });

        // === Mostrar información de IP ===
        async function getIpInfo() {
            try {
                const response = await fetch("https://ipapi.co/json/");
                const data = await response.json();
                document.getElementById("ipInfo").innerHTML = `
                    IP: ${data.ip}<br>
                    Ciudad: ${data.city}<br>
                    País: ${data.country_name}<br>
                    Región: ${data.region}<br>
                    Proveedor: ${data.org || "Desconocido"}
                `;
            } catch (e) {
                document.getElementById("ipInfo").textContent = "No se pudo obtener la información IP.";
            }
        }

        // === Test de descarga múltiple para evitar fallos CORS o bloqueo ===
        async function measureDownload() {
            const downloadSpeedEl = document.getElementById("downloadSpeed");
            const startBtn = document.getElementById("startBtn");

            startBtn.disabled = true;
            startBtn.textContent = "Midiendo...";
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.update();

            try {
                const fileURL = "https://download.samplelib.com/mp4/sample-5s.mp4";
                const chunkSizeBytes = 500000; // medir aprox 0.5MB por chunk
                const totalChunks = 20; // 20 chunks, total aprox 10MB
                let totalBytes = 0;

                const startTime = performance.now();

                for (let i = 0; i < totalChunks; i++) {
                    // Añade un parámetro al URL para evitar cache
                    const response = await fetch(`${fileURL}?cache_bust=${Date.now()}_${i}`, { cache: "no-store" });
                    if (!response.ok) throw new Error(`Error al descargar chunk ${i + 1}: código ${response.status}`);

                    const blob = await response.blob();
                    totalBytes += blob.size;

                    // Progreso visual aproximado
                    const elapsed = (performance.now() - startTime) / 1000;
                    const speedMbps = (totalBytes * 8) / (elapsed * 1024 * 1024);
                    chart.data.labels.push((elapsed).toFixed(1));
                    chart.data.datasets[0].data.push(speedMbps);
                    chart.update();
                    downloadSpeedEl.innerHTML = `${speedMbps.toFixed(2)} <span class="units">Mbps</span>`;
                }

                const endTime = performance.now();
                const duration = (endTime - startTime) / 1000;
                const finalSpeedMbps = (totalBytes * 8) / (duration * 1024 * 1024);

                downloadSpeedEl.innerHTML = `${finalSpeedMbps.toFixed(2)} <span class="units">Mbps</span> (finalizado)`;
            } catch (error) {
                downloadSpeedEl.textContent = `Error en el test: ${error.message}`;
                console.error(error);
            } finally {
                startBtn.disabled = false;
                startBtn.textContent = "Iniciar Test";
            }
        }

        // === Eventos ===
        document.getElementById("startBtn").addEventListener("click", measureDownload);
        getIpInfo();
    </script>
</body>
</html>
