<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="https://raw.githubusercontent.com/molavita/speed/refs/heads/gh-pages/imagen/speed.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test de Velocidad MTM</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%);
      color: #fff;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
    }
    .title { font-size: 24px; margin-bottom: 20px; }
    .speed { font-size: 36px; font-weight: bold; margin: 10px 0; }
    .units { font-size: 18px; }
    .button {
      background-color: #00aaff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      margin: 5px;
    }
    .button:hover { background-color: #0077cc; }
    .button:disabled {
      background-color: #666;
      cursor: not-allowed;
    }
    #myChart { width: 100%; height: 250px; margin-top: 20px; }
    #ipInfo { margin-top: 15px; font-size: 16px; line-height: 1.4; }
    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      margin: 15px 0;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background-color: #00aaff;
      width: 0%;
      transition: width 0.3s;
    }
    .status {
      margin: 10px 0;
      font-size: 14px;
      color: #ddd;
    }
    .test-info {
      margin: 10px 0;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">Test de Velocidad MTM</div>

    <div>Velocidad de descarga</div>
    <div id="downloadSpeed" class="speed">0 <span class="units">Mbps</span></div>

    <div class="progress-bar">
      <div class="progress" id="progressBar"></div>
    </div>
    <div class="status" id="status">Listo para iniciar</div>
    <div class="test-info" id="testInfo">Pulsa el botón para comenzar.</div>

    <div id="ipInfo">Cargando información IP...</div>

    <button class="button" id="startBtn">Iniciar Test</button>

    <canvas id="myChart"></canvas>
  </div>

  <script>
    const ctx = document.getElementById('myChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { 
        labels: [], 
        datasets: [{
          label: 'Velocidad (Mbps)',
          borderColor: 'rgb(0, 170, 255)',
          backgroundColor: 'rgba(0, 170, 255, 0.1)',
          data: [],
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        animation: false,
        scales: {
          x: { title: { display: true, text: 'Progreso' } },
          y: { min: 0, title: { display: true, text: 'Mbps' }, suggestedMax: 100 }
        }
      }
    });

    async function getIpInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        document.getElementById('ipInfo').innerHTML = `
          🌐 <b>IP:</b> ${data.ip} <br>
          📍 <b>Ciudad:</b> ${data.city || 'Desconocida'} <br>
          🏢 <b>Proveedor:</b> ${data.org || 'No disponible'}
        `;
      } catch (error) {
        document.getElementById('ipInfo').innerHTML = "⚠️ No se pudo obtener la información IP.";
      }
    }

    async function measureDownload() {
      const downloadSpeedEl = document.getElementById('downloadSpeed');
      const startBtn = document.getElementById('startBtn');
      const progressBar = document.getElementById('progressBar');
      const statusEl = document.getElementById('status');
      const testInfoEl = document.getElementById('testInfo');
      
      startBtn.disabled = true;
      startBtn.textContent = "Midiendo...";
      progressBar.style.width = '0%';
      testInfoEl.innerHTML = "Iniciando...";
      chart.data.labels = [];
      chart.data.datasets[0].data = [];
      chart.update();
      
      const testUrl = "https://speed.cloudflare.com/__down?bytes=50000000";
      let speeds = [];
      let resultadosAcumulados = "";
      const testDuration = 8000;
      
      for (let i = 0; i < 3; i++) {
        statusEl.textContent = `Realizando Prueba ${i+1} de 3...`;
        
        try {
          const speed = await performAccurateDownloadTest(testUrl, testDuration, i);
          
          // Guardar y mostrar resultado individual
          speeds.push(speed);
          resultadosAcumulados += `Prueba ${i+1}: <b>${speed.toFixed(2)} Mbps</b><br>`;
          testInfoEl.innerHTML = resultadosAcumulados;

          // Actualizar gráfico y barra
          chart.data.labels.push(`P${i+1}`);
          chart.data.datasets[0].data.push(speed.toFixed(2));
          chart.update();
          
          downloadSpeedEl.innerHTML = `${speed.toFixed(2)} <span class="units">Mbps</span>`;
          progressBar.style.width = `${((i + 1) / 3) * 100}%`;
          
        } catch (error) {
          console.error(error);
          resultadosAcumulados += `Prueba ${i+1}: <span style="color:#ff6b6b">Error</span><br>`;
          testInfoEl.innerHTML = resultadosAcumulados;
          speeds.push(0);
        }
        
        if (i < 2) await new Promise(r => setTimeout(r, 1000));
      }
      
      // Cálculo de la media final
      const validSpeeds = speeds.filter(s => s > 0);
      const avgSpeed = validSpeeds.length > 0 ? (validSpeeds.reduce((a, b) => a + b, 0) / validSpeeds.length) : 0;
      
      downloadSpeedEl.innerHTML = `${avgSpeed.toFixed(2)} <span class="units">Mbps</span>`;
      statusEl.textContent = "Test completado";
      
      // Mostrar la media al final
      testInfoEl.innerHTML = resultadosAcumulados + 
        `<hr style="border:0; border-top:1px solid rgba(255,255,255,0.2); margin:10px 0;">` +
        `<span style="font-size:18px;"><b>MEDIA TOTAL: ${avgSpeed.toFixed(2)} Mbps</b></span>`;
      
      startBtn.disabled = false;
      startBtn.textContent = "Reiniciar Test";
    }

    function performAccurateDownloadTest(url, duration, testId) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        let startTime;
        let lastUpdate = 0;

        // FIX: Usamos '&' porque Cloudflare ya usa '?' en la URL original
        const finalUrl = url + "&nocache=" + Date.now() + "_" + testId;

        xhr.open('GET', finalUrl, true);
        xhr.responseType = 'blob'; 

        xhr.onprogress = (e) => {
          if (!startTime) startTime = performance.now();
          const now = performance.now();
          const timeElapsed = (now - startTime) / 1000;

          if (timeElapsed > 0 && e.loaded > 0) {
            const speedMbps = (e.loaded * 8) / (timeElapsed * 1000000);
            document.getElementById('downloadSpeed').innerHTML = 
              `${speedMbps.toFixed(2)} <span class="units">Mbps</span>`;
            
            // Actualizar gráfico en tiempo real cada 300ms para fluidez
            if (now - lastUpdate > 300) {
              chart.data.datasets[0].data.push(parseFloat(speedMbps.toFixed(2)));
              chart.data.labels.push("");
              chart.update('none');
              lastUpdate = now;
            }
          }
        };

        const finalize = () => {
          if (!startTime) return resolve(0);
          const timeElapsed = (performance.now() - startTime) / 1000;
          const size = xhr.response ? xhr.response.size : 0;
          const speed = (size * 8) / (timeElapsed * 1000000);
          resolve(speed || 0);
        };

        xhr.onload = finalize;
        xhr.onerror = () => resolve(0);
        xhr.onabort = () => resolve(0);

        // Seguridad para que el test no se quede pillado
        setTimeout(() => {
          if (xhr.readyState !== 4) xhr.abort();
        }, duration);

        xhr.send();
      });
    }

    document.getElementById('startBtn').addEventListener('click', measureDownload);
    getIpInfo();
  </script>
</body>
</html>
